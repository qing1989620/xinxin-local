<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xinxin 启动失败</title>
<style>
  :root{
    --bg:#f7f5ef;
    --ink:#2b2f2d;
    --muted:#7c857f;
    --accent:#376c62;
    --danger:#9b4a3a;
    --hairline:#e3ded2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:min(560px,92vw)}
  .mark{width:56px;height:56px;margin:0 0 24px;display:block}
  h1{font-size:19px;font-weight:600;letter-spacing:.06em;margin-bottom:12px}
  .lead{font-size:13px;line-height:1.85;color:var(--muted);margin-bottom:20px}
  .message{
    border:1px solid var(--hairline);
    border-left:3px solid var(--danger);
    border-radius:10px;
    background:#fffdf8;
    padding:14px 16px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
    word-break:break-all;
    margin-bottom:20px;
  }
  .log{
    border:1px solid var(--hairline);
    border-radius:10px;
    background:#fffdf8;
    padding:14px 16px;
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:12px;
    line-height:1.75;
    color:var(--muted);
    max-height:220px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-all;
    margin-bottom:22px;
  }
  .logpath{
    font-size:12px;
    line-height:1.8;
    color:var(--muted);
    margin:-10px 0 20px;
    word-break:break-all;
  }
  .logpath code{
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:11.5px;
    color:var(--ink);
    background:#efece3;
    border-radius:5px;
    padding:2px 6px;
  }
  .steps{font-size:13px;line-height:2;color:var(--muted)}  .steps b{color:var(--ink);font-weight:600}
  .steps code{
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:12px;
    background:#efece3;
    border-radius:5px;
    padding:2px 7px;
    color:var(--ink);
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#376c62"/>
      <path d="M19 19l26 26M45 19L19 45" stroke="#faf8f0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="7" fill="#faf8f0"/>
    </svg>
    <h1>这次没能启动</h1>
    <p class="lead">电脑端已经尽力了：本地服务没有在预期时间内就绪。下面是原因和日志尾部。</p>
    <div class="message">{{MESSAGE}}</div>
    <div class="log">{{LOG}}</div>
    <p class="logpath">完整日志：<code>{{LOGPATH}}</code></p>
    <div class="steps">
      <b>可以试试：</b><br>
      1. 关掉这个窗口，重新双击桌面上的 Xinxin 图标；<br>
      2. 在项目目录手动运行 <code>.\Start-Xinxin-Local.ps1 -NoBrowser</code> 看完整输出；<br>
      3. 端口被别的程序占用时，换一个网关端口：<code>-GatewayPort 8081</code>。
    </div>
  </main>
</body>
</html>
