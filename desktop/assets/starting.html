<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xinxin 正在启动</title>
<style>
  :root{
    --bg:#f7f5ef;
    --ink:#2b2f2d;
    --muted:#626d64;
    --accent:#376c62;
    --hairline:#e3ded2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:min(480px,86vw);text-align:center;padding:42px 28px;border:1px solid var(--hairline);border-radius:12px;background:#fffdf9}
  .eyebrow{font-size:10px;letter-spacing:.16em;margin-bottom:28px;color:var(--muted)}
  .mark{width:72px;height:72px;margin:0 auto 30px;display:block}
  .mark .ring{transform-origin:32px 32px;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(.965)}}
  h1{font-size:30px;font-weight:550;letter-spacing:-.04em;margin-bottom:18px;line-height:1.35}
  p{font-size:13px;line-height:1.75;color:var(--muted);min-height:23px}
  .elapsed{margin-top:22px;font-size:12px;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}
  .elapsed b{color:var(--accent);font-weight:600}
  .hint{margin-top:26px;padding-top:18px;border-top:1px solid var(--hairline);font-size:12px;color:var(--muted);line-height:1.9}
  @media (prefers-reduced-motion: reduce){.mark .ring{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">XINXIN / A SPACE OF YOUR OWN</p>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <g class="ring">
        <rect width="64" height="64" rx="16" fill="#376c62"/>
        <path d="M19 19l26 26M45 19L19 45" stroke="#faf8f0" stroke-width="4" stroke-linecap="round"/>
        <circle cx="32" cy="32" r="7" fill="#faf8f0"/>
      </g>
    </svg>
    <h1>Xinxin 正在启动</h1>
    <p id="phase" role="status" aria-live="polite">正在唤醒本机服务</p>
    <div class="elapsed">已等待 <b id="sec">0</b> 秒</div>
    <div class="hint">启动完成后会自动打开应用窗口<br>关掉这个页面不会中断启动</div>
  </main>
  <script>
    var t0 = Date.now();
    var phases = ["正在唤醒本机服务", "正在准备界面与连接，请稍候", "仍在准备，完成后会自动进入空间"];
    setInterval(function () {
      var s = Math.floor((Date.now() - t0) / 1000);
      document.getElementById("sec").textContent = s;
      var phase = phases[Math.min(phases.length - 1, Math.floor(s / 20))];
      if (document.getElementById("phase").textContent !== phase) document.getElementById("phase").textContent = phase;
    }, 1000);
  </script>
</body>
</html>
