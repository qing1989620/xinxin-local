# Install as /etc/systemd/system/tailscaled.service.d/xinxin.conf.
# The distribution's tailscaled unit still supplies its networking capabilities.
# Install allow-aliyun-tailnet-replies.sh in /usr/local/libexec first.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
MemoryHigh=192M
MemoryMax=256M
CPUQuota=50%
ExecStartPost=/usr/local/libexec/xinxin-aliyun-tailnet-replies
