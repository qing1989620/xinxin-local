[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xinxin-backend"
version = "0.1.0"
description = "A private agent workspace for one owner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.8,<3", "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2",
  "cryptography>=43", "numpy>=1.26,<3", "PyYAML>=6,<7",
  "Pillow>=11", "matplotlib>=3.9", "pandas>=2.2,<3",
  "pypdf>=5,<7", "python-docx>=1.1,<2",
  "psutil>=7,<8", "pywin32>=306; sys_platform == 'win32'",
  "onnxruntime>=1.19,<2", "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

